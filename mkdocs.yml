site_name: robotsix-llmio
site_description: Provider-agnostic LLM I/O for pydantic-ai agents
site_url: https://damien-robotsix.github.io/robotsix-llmio/
repo_url: https://github.com/damien-robotsix/robotsix-llmio

theme:
  name: material

docs_dir: docs

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            separate_signature: true
            members_order: source
            signature_crossrefs: true
            filters: ["!^_"]
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Core: core/index.md
  - Failover runbook: core/failover-runbook.md
  - Failover cost validation: core/failover-cost-validation.md
  - Failover disable & rollback: core/failover-rollback.md
  - Config: config/index.md
  - OpenRouter: openrouter/index.md
  - Claude SDK: claude_sdk/index.md
  - Knowledge: clients/knowledge/index.md
  - Refdocs: clients/refdocs/index.md
  - Self-Review: clients/self_review/index.md

  - API Reference:
      - Core: core/reference.md
      - Logging: core/logging.md
      - OpenRouter: openrouter/reference.md
      - Claude SDK: claude_sdk/reference.md

      - Config: config/reference.md
      - Exceptions: core/exceptions.md
      - Knowledge: clients/knowledge/reference.md
      - Refdocs: clients/refdocs/reference.md
      - Self-Review: clients/self_review/reference.md
  - Contributing: contributing.md
  - Changelog: changelog.md
