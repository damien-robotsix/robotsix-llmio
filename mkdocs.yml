site_name: robotsix-llmio
site_description: Provider-agnostic LLM I/O for pydantic-ai agents
site_url: https://damien-robotsix.github.io/robotsix-llmio/
repo_url: https://github.com/damien-robotsix/robotsix-llmio

theme:
  name: material

docs_dir: docs

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            separate_signature: true
            members_order: source
            signature_crossrefs: true
            filters: ["!^_"]
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Core: core/index.md
  - Config: config/index.md
  - OpenRouter: openrouter/index.md
  - Claude SDK: claude_sdk/index.md
  - Knowledge: clients/knowledge/index.md
  - Refdocs: clients/refdocs/index.md
  - Self-Review: clients/self_review/index.md

  - API Reference:
      - Core: reference/core.md
      - Logging: reference/logging.md
      - OpenRouter: reference/openrouter.md
      - Claude SDK: reference/claude_sdk.md

      - Config: reference/config.md
      - Exceptions: reference/exceptions.md
      - Knowledge: reference/knowledge.md
      - Refdocs: reference/refdocs.md
      - Self-Review: reference/self_review.md
  - Contributing: contributing.md
  - Changelog: changelog.md
