site_name: robotsix-llmio
site_description: Provider-agnostic LLM I/O for pydantic-ai agents
repo_url: https://github.com/damien-robotsix/robotsix-llmio

theme:
  name: material

docs_dir: docs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            separate_signature: true
            members_order: source
            signature_crossrefs: true
            filters: ["!^_"]
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Core: core/index.md
  - Config: config/index.md
  - OpenRouter: openrouter/index.md
  - Claude SDK: claude_sdk/index.md
  - Weekly Pace: weekly_pace/index.md
  - Tools: tools/index.md
  - API Reference:
      - Core: reference/core.md
      - Logging: reference/logging.md
      - OpenRouter: reference/openrouter.md
      - Claude SDK: reference/claude_sdk.md
      - Tools: reference/tools.md
      - Config: reference/config.md
      - Weekly Pace: reference/weekly_pace.md
      - Exceptions: reference/exceptions.md
  - Changelog: changelog.md
