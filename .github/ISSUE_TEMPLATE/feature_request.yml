name: Feature request
description: Suggest an enhancement or new capability.
title: "[Feature]: "
labels: ["feature request"]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Confirm you searched first
      description: Please search [existing issues](https://github.com/damien-robotsix/robotsix-llmio/issues) — someone may have already requested this.
      options:
        - label: I searched and didn't find a matching request.
          required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case / problem
      description: What problem would this feature solve for you?
      placeholder: I'm always frustrated when …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like — API shape, config option, new provider, etc.
      placeholder: A clear description of what you want to happen.
    validations:
      required: true
