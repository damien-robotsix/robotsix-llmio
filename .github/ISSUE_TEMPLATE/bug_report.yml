name: Bug report
description: File a bug report to help us improve.
title: "[Bug]: "
labels: ["bug", "pending"]
body:
  - type: checkboxes
    id: duplicates
    attributes:
      label: Confirm you checked for duplicates
      description: Please search [existing issues](https://github.com/damien-robotsix/robotsix-llmio/issues) before filing a new one.
      options:
        - label: I searched and didn't find a matching issue.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the bug. Code snippets are very helpful!
      render: python
      placeholder: |
        import robotsix_llmio
        ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version info
      description: |
        Python version (`python --version`) and package version
        (`pip show robotsix-llmio`).
      placeholder: e.g. Python 3.12, robotsix-llmio 0.1.0
    validations:
      required: true
