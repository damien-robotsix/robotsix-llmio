name: 'Setup repo'
description: 'Checkout and setup-uv with caching'
inputs:
  python-version:
    description: 'Python version to install'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0  # zizmor: ignore
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}
