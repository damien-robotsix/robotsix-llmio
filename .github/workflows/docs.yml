name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}  # deny by default; the job grants what it needs

jobs:
  deploy:
    permissions:
      contents: read
      pages: write      # deploy to GitHub Pages
      id-token: write   # OIDC token for Pages deployment auth
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-docs.yml@8e713c7c8867caa653483a934e2b74a62e31fc0b # main
    with:
      docs-install-args: "--group docs"
