name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install uv
        run: pip install uv
      - name: Deploy docs
        run: uv sync --frozen --extra docs && uv run mkdocs gh-deploy --force
