name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}  # deny by default; the job grants what it needs

jobs:
  deploy:
    permissions:
      contents: read
      pages: write      # deploy to GitHub Pages
      id-token: write   # OIDC token for Pages deployment auth
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-docs.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794 # v1.5.0
    with:
      docs-install-args: "--group docs"
