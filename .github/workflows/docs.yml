name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}  # deny by default; the job grants what it needs

jobs:
  deploy:
    permissions:
      contents: read
      pages: write      # deploy to GitHub Pages
      id-token: write   # OIDC token for Pages deployment auth
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-docs.yml@daa74f7c13e04bc77109021922e3fcaa9644b75c # main
    with:
      docs-install-args: "--group docs"
