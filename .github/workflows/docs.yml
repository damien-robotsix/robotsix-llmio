name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}  # deny by default; the job grants what it needs

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-docs.yml@43309967ea8011400212a8995d33ca900ee2afed # main
    with:
      docs-install-args: "--group docs"
