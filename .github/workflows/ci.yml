name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      security-events: write  # upload SARIF from the scan
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@eeced1217f95cc04e514102571282a2ff2d1e3f1 # main
    with:
      python-version: "3.14"
      install-extras: "openrouter claude_sdk tracing"
      cov-package: src/robotsix_llmio
      coverage-threshold: "80"
      pytest-args: '-m "not live" -n 4'
      mypy-advisory: false

  checks:
    name: Checks (vulture + deptry + modules)
    # Hand-rolled gate, justified: vulture, deptry, and modules-registration
    # are pre-commit hooks in the standard set, but CI does not run
    # `pre-commit run --all-files` yet and no shared workflow carries these
    # checks — keep this job until one of the two exists (tracked as a
    # standards gap).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_MALWARE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-repo
        with:
          python-version: '3.14'
      - name: uv lock --check (lockfile consistency)
        run: uv lock --check
      - run: uv sync --frozen
      - name: vulture (dead code)
        run: uv run vulture --ignore-decorators "@field_validator,@model_validator" src/ vulture_whitelist.py
      - name: deptry (dependency hygiene)
        run: uv run deptry src
      - name: modules (registration check)
        run: uv run robotsix-modules check-registration docs/modules.yaml --root .

  security:
    permissions:
      contents: read
      security-events: write  # upload SARIF from the scan
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@eeced1217f95cc04e514102571282a2ff2d1e3f1 # main
    with:
      install-extras: "openrouter claude_sdk"
      trufflehog-pr-diff: true
      trufflehog-extra-args: "--results=verified,unknown"
      pip-audit-ignore-vulns: "CVE-2026-59950"

  codeql:
    name: CodeQL
    # Hand-rolled gate, justified: the shared codeql.yml reusable workflow
    # exists but takes no config-file input, and this repo needs
    # .github/codeql/codeql-config.yml (documented PEP-562 false-positive
    # suppressions and test-path excludes). Switch to the shared caller once
    # it grows config support (enhancement ticketed on the workflows board).
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload CodeQL results
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          upload: false
          output: results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # if: always() — a failed analyze step must not silently skip the
        # upload of whatever results exist (repo-baseline artifact-upload rule).
        if: always()
        with:
          name: codeql-results
          path: results.sarif
          if-no-files-found: error
