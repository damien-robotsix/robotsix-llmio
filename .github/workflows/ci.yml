name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    uses: damien-robotsix/robotsix-mill/.github/workflows/python-ci.yml@main
    with:
      python-version: ${{ matrix.python }}
      install-extras: "openrouter_deepseek claude_sdk tracing dev"
      cov-package: src/robotsix_llmio
      coverage-threshold: "90"
      pytest-args: '-m "not live"'
      run-deptry: false
      run-bandit: true
      mypy-advisory: true

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --frozen --extra openrouter_deepseek --extra claude_sdk --extra tracing --extra dev
      - run: uv run mypy src/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.13'
      - name: Install package + extras
        run: uv sync --frozen --extra openrouter_deepseek --extra claude_sdk --extra dev
      - name: Dependency vulnerability audit
        run: |
          uv run pip-audit --format cyclonedx-json --output sbom.json || true
          uv run pip-audit || true  # for human-readable report
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

  secrets-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
