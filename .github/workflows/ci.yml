name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      security-events: write  # upload SARIF from the scan
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@eeced1217f95cc04e514102571282a2ff2d1e3f1 # main
    with:
      python-version: "3.14"
      install-extras: "openrouter claude_sdk tracing"
      cov-package: src/robotsix_llmio
      coverage-threshold: "80"
      pytest-args: '-m "not live" -n 4'
      mypy-advisory: false

  vulture:
    name: Vulture
    # Hand-rolled gate, justified: vulture (dead-code check) is a pre-commit
    # hook in the standard set, but CI does not run `pre-commit run
    # --all-files` yet and no shared workflow carries vulture — keep this job
    # until one of the two exists (tracked as a standards gap).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_MALWARE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-repo
        with:
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv run --with vulture vulture src/ vulture_whitelist.py

  audit:
    name: Dependency audit
    # Hand-rolled gate, justified: no shared workflow carries uv audit yet —
    # keep this job until the shared python-ci.yml grows an audit input
    # (tracked as a standards gap).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_MALWARE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-repo
        with:
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv audit --locked

  modules:
    name: Modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_MALWARE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-repo
        with:
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv run --with robotsix-modules robotsix-modules-validate docs/modules.yaml

  changelog:
    name: Changelog
    # Hand-rolled gate, justified: robotsix-github-workflows carries no shared
    # changelog-check workflow yet — replace this job with the shared caller
    # once one exists (tracked as a standards gap).
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_MALWARE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: towncrier check
        # GITHUB_BASE_REF is provided by Actions on pull_request events.
        run: uvx towncrier check --compare-with "origin/${GITHUB_BASE_REF}"

  security:
    permissions:
      contents: read
      security-events: write  # upload SARIF from the scan
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@eeced1217f95cc04e514102571282a2ff2d1e3f1 # main
    with:
      install-extras: "openrouter claude_sdk"
      trufflehog-pr-diff: true
      trufflehog-extra-args: "--results=verified,unknown"
      pip-audit-ignore-vulns: "CVE-2026-59950"

  codeql:
    name: CodeQL
    # Hand-rolled gate, justified: the shared codeql.yml reusable workflow
    # exists but takes no config-file input, and this repo needs
    # .github/codeql/codeql-config.yml (documented PEP-562 false-positive
    # suppressions and test-path excludes). Switch to the shared caller once
    # it grows config support (enhancement ticketed on the workflows board).
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload CodeQL results
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          upload: false
          output: results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # if: always() — a failed analyze step must not silently skip the
        # upload of whatever results exist (repo-baseline artifact-upload rule).
        if: always()
        with:
          name: codeql-results
          path: results.sarif
          if-no-files-found: error
