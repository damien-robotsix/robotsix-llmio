name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    uses: damien-robotsix/robotsix-mill/.github/workflows/python-ci.yml@0977e0113ba543c57c3a75063051a6feb56d789d # main
    with:
      python-version: ${{ matrix.python }}
      install-extras: "openrouter_deepseek claude_sdk tracing dev"
      cov-package: src/robotsix_llmio
      coverage-threshold: "90"
      pytest-args: '-m "not live"'
      run-deptry: false
      run-bandit: true
      mypy-advisory: false

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Lint (ruff check)
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4
        with:
          args: "check --output-format=github"
      - name: Format (ruff format)
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4
        with:
          args: "format --check --diff"

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-repo
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra openrouter_deepseek --extra claude_sdk --extra tracing --extra dev
      - run: uv run mypy src/
      - run: uv run --with vulture vulture src/ vulture_whitelist.py

  security:
    uses: damien-robotsix/robotsix-mill/.github/workflows/python-security.yml@0977e0113ba543c57c3a75063051a6feb56d789d # main
    with:
      install-extras: "openrouter_deepseek claude_sdk dev"
      trufflehog-pr-diff: true
      trufflehog-extra-args: "--results=verified,unknown"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          upload: false
          output: results.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-results
          path: results.sarif

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-repo
      - run: uv audit --frozen

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-repo
      - run: uv export --frozen --format cyclonedx1.5 --preview-features sbom-export > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cdx.json
