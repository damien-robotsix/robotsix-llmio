name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      security-events: write  # upload SARIF from the scan
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794 # v1.5.0
    with:
      python-version: "3.14"
      install-extras: "openrouter claude_sdk anthropic tracing"
      cov-package: src/robotsix_llmio
      coverage-threshold: "80"
      pytest-args: '-m "not live" -n 4'
      mypy-advisory: false
      check-lock: true
      run-vulture: true
      vulture-args: '--ignore-decorators "@field_validator,@model_validator" src/ vulture_whitelist.py'

  security:
    permissions:
      contents: read
      security-events: write  # upload SARIF from the scan
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794 # v1.5.0
    with:
      install-extras: "openrouter claude_sdk anthropic"
      trufflehog-pr-diff: true
      trufflehog-extra-args: "--results=verified,unknown"
      pip-audit-ignore-vulns: "CVE-2026-59950"
