name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@eeced1217f95cc04e514102571282a2ff2d1e3f1 # main
    with:
      python-version: "3.14"
      install-extras: "openrouter claude_sdk tracing"
      cov-package: src/robotsix_llmio
      coverage-threshold: "80"
      pytest-args: '-m "not live" -n 4'
      mypy-advisory: false

  vulture:
    # Hand-rolled gate, justified: vulture (dead-code check) is a pre-commit
    # hook in the standard set, but CI does not run `pre-commit run
    # --all-files` yet and no shared workflow carries vulture — keep this job
    # until one of the two exists (tracked as a standards gap).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-repo
        with:
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv run --with vulture vulture src/ vulture_whitelist.py

  security:
    permissions:
      contents: read
      security-events: write
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@eeced1217f95cc04e514102571282a2ff2d1e3f1 # main
    with:
      install-extras: "openrouter claude_sdk"
      trufflehog-pr-diff: true
      trufflehog-extra-args: "--results=verified,unknown"

  codeql:
    # Hand-rolled gate, justified: the shared codeql.yml reusable workflow
    # exists but takes no config-file input, and this repo needs
    # .github/codeql/codeql-config.yml (documented PEP-562 false-positive
    # suppressions and test-path excludes). Switch to the shared caller once
    # it grows config support (enhancement ticketed on the workflows board).
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          upload: false
          output: results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # if: always() — a failed analyze step must not silently skip the
        # upload of whatever results exist (repo-baseline artifact-upload rule).
        if: always()
        with:
          name: codeql-results
          path: results.sarif
          if-no-files-found: error
