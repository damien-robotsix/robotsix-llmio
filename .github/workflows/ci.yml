name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ github.triggering_actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@eeced1217f95cc04e514102571282a2ff2d1e3f1 # main
    with:
      python-version: ${{ matrix.python }}
      install-extras: "openrouter claude_sdk tracing dev"
      cov-package: src/robotsix_llmio
      coverage-threshold: "90"
      pytest-args: '-m "not live" -n 4'
      run-deptry: false
      run-bandit: false
      mypy-advisory: false

  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Lint (ruff check)
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: "check --output-format=github"
      - name: Format (ruff format)
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: "format --check --diff"

  mypy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-repo
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra openrouter --extra claude_sdk --extra tracing --extra dev
      - run: uv run mypy src/
      - run: uv run --with vulture vulture src/ vulture_whitelist.py

  security:
    if: ${{ github.triggering_actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      security-events: write
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@eeced1217f95cc04e514102571282a2ff2d1e3f1 # main
    with:
      install-extras: "openrouter claude_sdk dev"
      trufflehog-pr-diff: true
      trufflehog-extra-args: "--results=verified,unknown"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          upload: false
          output: results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-results
          path: results.sarif

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-repo
      - run: uv audit --frozen

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-repo
      - run: uv export --frozen --format cyclonedx1.5 --preview-features sbom-export > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  dependabot-tests:
    if: ${{ github.triggering_actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/setup-repo
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra openrouter --extra claude_sdk --extra tracing --extra dev
      - run: uv run pytest -m "not live" -n 4

  required-checks:
    if: always()
    needs: [ci, ruff, mypy, security, codeql, dependabot-tests]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify required jobs passed
        env:
          RESULTS: "${{ needs.ci.result }} ${{ needs.ruff.result }} ${{ needs.mypy.result }} ${{ needs.security.result }} ${{ needs.codeql.result }} ${{ needs.dependabot-tests.result }}"
        run: |
          echo "dependency results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job did not pass ($r)"; exit 1
            fi
          done
