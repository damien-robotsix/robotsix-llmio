name: Dependency Review

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write  # documented exception: PR summary comment (comment-summary-in-pr)
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/dependency-review.yml@47523e8aa2d34d41da060d29b57f75ab262cb840 # v1.4.0
    with:
      fail-on-severity: moderate
      allow-licenses: "MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC, 0BSD, Unlicense, Python-2.0"
      # Per-package license exceptions (certifi) live in the config file.
      config-file: ./.github/dependency-review-config.yml
