name: Lint workflows

# Standalone workflow-security guard, kept SEPARATE from ci.yml on purpose.
# Uses zizmor (permissions, template injection, unpinned actions, ...) and
# actionlint (syntax + shellcheck) to catch issues that could cause a
# 0-second startup_failure — so a check living inside ci.yml itself could
# never run to report them. This file has no risky caller jobs, so it always
# runs.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write  # required by zizmor-action advanced-security SARIF upload

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d  # v0.5.6
        with:
          advanced-security: true
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
