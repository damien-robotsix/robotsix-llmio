name: Lint workflows

# Standalone workflow-security guard, kept SEPARATE from ci.yml on purpose:
# a broken ci.yml causes a 0-second startup_failure, so a check living
# inside ci.yml could never run to report it. Now calls the shared
# reusable instead of hand-rolling actionlint + zizmor.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint-workflows:
    permissions:
      contents: read
      security-events: write  # zizmor SARIF upload
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@8e713c7c8867caa653483a934e2b74a62e31fc0b # main
    with:
      run-actionlint: true
      run-zizmor: true
