name: Refresh git dependencies

on:
  schedule:
    - cron: "0 7 * * 1"  # weekly Monday, before auto-release (09:00 UTC)
  workflow_dispatch:

# Only one refresh workflow should run at a time
concurrency:
  group: refresh-git-deps
  cancel-in-progress: true

# Job-scoped below, not here.
permissions: {}

jobs:
  refresh:
    name: Refresh git dependencies
    permissions:
      contents: write       # push the bump branch
      pull-requests: write  # create the bump PR
    # Consume the shared first-party pin bump. The reusable workflow mints a
    # scoped GitHub-App installation token (not GITHUB_TOKEN, which GitHub
    # suppresses to prevent recursion on events it creates), runs
    # `uv lock --upgrade-package <packages>` per package, and opens the PR via
    # bump-commit-pr — so bump fixes propagate fleet-wide.
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/bump.yml@b8568722fa33fba3196a0364609b4c8bbb065a83  # main
    with:
      bump-mode: deps
      packages: "robotsix-http robotsix-modules"
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
