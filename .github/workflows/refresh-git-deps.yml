name: Refresh git dependencies

on:
  schedule:
    - cron: "0 7 * * 1"  # weekly Monday, before auto-release (09:00 UTC)
  workflow_dispatch:

# Only one refresh workflow should run at a time
concurrency:
  group: refresh-git-deps
  cancel-in-progress: true

permissions: {}

jobs:
  refresh:
    name: Refresh git dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create commits
      pull-requests: write  # needed to create PRs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true
      - run: uv lock --upgrade-package robotsix-http --upgrade-package robotsix-modules
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7  # zizmor: ignore[superfluous-actions]
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): refresh git-pinned dependencies"
          title: "chore(deps): refresh git-pinned dependencies"
          branch: deps/refresh-git-deps
          base: main
          labels: dependencies
