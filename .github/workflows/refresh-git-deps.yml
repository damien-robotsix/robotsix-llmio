name: Refresh git dependencies

on:
  schedule:
    - cron: "0 7 * * 1"  # weekly Monday, before auto-release (09:00 UTC)
  workflow_dispatch:

# Only one refresh workflow should run at a time
concurrency:
  group: refresh-git-deps
  cancel-in-progress: true

permissions: {}

jobs:
  refresh:
    name: Refresh git dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create commits
      pull-requests: write  # needed to create PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          enable-cache: true
      - run: uv lock --upgrade-package robotsix-http --upgrade-package robotsix-modules
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v7  # zizmor: ignore[superfluous-actions]
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): refresh git-pinned dependencies"
          title: "chore(deps): refresh git-pinned dependencies"
          branch: deps/refresh-git-deps
          base: main
          labels: dependencies
