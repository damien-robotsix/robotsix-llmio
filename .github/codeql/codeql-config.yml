# CodeQL analysis configuration.
#
# Exclude test code from analysis. Tests deliberately contain patterns the
# security-and-quality suite flags — hostname-substring assertions
# (py/incomplete-url-substring-sanitization), dual import styles
# (py/import-and-import-from), intentionally unclosed handles, etc. The real
# security surface is src/, so analysis there stays strict; only test noise
# is suppressed at the source.
paths-ignore:
  - tests/**
  - vulture_whitelist.py

# ---------------------------------------------------------------------------
# Query-level suppressions
# ---------------------------------------------------------------------------
#
# py/undefined-export — CodeQL cannot model PEP 562 __getattr__ lazy re-exports.
# Every __init__.py in this package that uses PEP 562 triggers this false positive
# on every name in __all__, because CodeQL's static analysis can't follow the
# dynamic dispatch.  The names ARE defined (reachable via __getattr__ at runtime,
# and statically declared under ``if TYPE_CHECKING:`` for type-checkers/IDEs).
#
# Suppressing this query repo-wide is safe because:
#   * All __all__ / __getattr__ blocks are tested (tests/config/test_lazy_imports.py
#     and friends verify every name resolves).
#   * Modules that *don't* use PEP 562 (static imports / in-file definitions)
#     never emit this query in the first place, so the suppression only
#     affects the PEP-562 lazy-export packages it is meant for.
#   * There is no CodeQL path-scoped filter for "files that use __getattr__",
#     and maintaining a per-file deny-list is fragile as new PEP-562 modules are added.
query-filters:
  - exclude:
      id: py/undefined-export

  # zizmor/artipacked — SHA-pinned well-known actions (actions/checkout,
  # actions/upload-artifact, github/codeql-action, astral-sh/*,
  # zizmorcore/zizmor-action).  No source-based or attested alternatives
  # exist.  SHA pinning provides integrity; the risk is accepted.
  # Composite actions use inline ``# zizmor: ignore`` comments instead.
  - exclude:
      id: zizmor/artipacked
