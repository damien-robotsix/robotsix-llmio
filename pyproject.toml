[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-llmio"
version = "0.1.0"
description = "Provider-agnostic LLM I/O for pydantic-ai agents, with derived per-provider layers (e.g. DeepSeek over OpenRouter)."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Damien SIX", email = "damien.robotsix@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # SLIM, not the full meta-package: the meta pulls every provider SDK plus
    # logfire (which auto-imports opentelemetry via a pydantic plugin) — we
    # keep the dependency surface minimal and let extras add provider support.
    "pydantic-ai-slim>=1.0",
    "httpx",
    # Imported directly (models/validators throughout) — declared explicitly
    # rather than relied on transitively via pydantic-ai-slim (deptry DEP003).
    "pydantic>=2",
    # Pin starlette to a version that resolves CVE-2026-54283 and
    # CVE-2026-54282 (transitively pulled via claude-agent-sdk -> mcp).
    "starlette>=1.3.1",
]

[project.urls]
Homepage      = "https://github.com/damien-robotsix/robotsix-llmio"
Repository    = "https://github.com/damien-robotsix/robotsix-llmio"
Documentation = "https://damien-robotsix.github.io/robotsix-llmio/"
Changelog     = "https://github.com/damien-robotsix/robotsix-llmio/blob/main/CHANGELOG.md"
Issues        = "https://github.com/damien-robotsix/robotsix-llmio/issues"

[project.optional-dependencies]
# Layer 2 — OpenRouter transport (OpenAIChatModel over the OpenRouter provider).
# `openai` is imported directly (provider.py), so it is declared explicitly
# rather than relied on transitively via the pydantic-ai-slim extra (DEP003).
openrouter = ["pydantic-ai-slim[openrouter]>=1.0", "openai"]
# Layer 2 (sibling) — Claude Agent SDK transport. No API key: authenticates via
# the local `claude login` subscription by spawning the `claude` CLI. Requires
# Node.js + a logged-in `claude` CLI at runtime (not pip-installable).
claude_sdk = ["claude-agent-sdk>=0.2.97"]
# Optional: emit cost/usage onto the active OpenTelemetry span AND export the
# resulting traces to Langfuse (core.setup_langfuse_tracing). Trace export is
# pure OTLP — no langfuse SDK needed.
tracing = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
]
# Dev tooling is an extra (not a PEP 735 dependency group) so that both
# `pip install .[dev]` and `uv sync --extra dev` work.
dev = ["pytest", "pytest-cov", "pytest-xdist", "pytest-timeout", "ruff", "mypy", "vulture", "pyyaml"]

# Docs tooling remains a PEP 735 dependency group — only needed for doc builds.
[dependency-groups]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_llmio"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
name = "robotsix-llmio"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Changed"
showcontent = true

[tool.deptry]
# The package itself is installed in the CI env, so deptry misreads
# `import robotsix_llmio` as a transitive dependency without this hint.
known_first_party = ["robotsix_llmio"]

[tool.deptry.per_rule_ignores]
# DEP002 (declared but never imported): starlette is a version floor for a
# transitive dependency (CVE-2026-54283/-54282 via claude-agent-sdk -> mcp),
# deliberately declared without being imported. The dev extra carries tooling
# (pytest, ruff, mypy, etc.) that is never imported at runtime.
DEP002 = [
    "starlette",
    "pytest", "pytest-cov", "pytest-xdist", "pytest-timeout",
    "ruff", "mypy", "vulture", "pyyaml",
]

[tool.vulture]
# Pydantic validators are invoked by the metaclass, never by direct name
# access, so vulture always flags them. Ignore them by decorator instead of
# listing each one in vulture_whitelist.py.
ignore_decorators = ["@model_validator", "@field_validator"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "F",   # pycodestyle errors + Pyflakes (was the default; now explicit)
    "I",        # isort — import sorting (no separate isort tool today)
    "UP",       # pyupgrade — modernize for the >=3.14 floor
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "RUF",      # Ruff-specific rules
    "S",        # flake8-bandit — security checks (replaces standalone bandit)
]

# Every ignore carries a justification (robotsix-standards python.md).
[tool.ruff.lint.per-file-ignores]
# B018/F821: a vulture whitelist is, by design, a list of bare name
# references to symbols defined elsewhere — useless expressions of
# undefined names are the file's entire content.
"vulture_whitelist.py" = ["B018", "F821"]
# S110 (try-except-pass): best-effort cleanup of an already-failing SDK
# stream — there is nothing useful to do or log on secondary failure.
"src/robotsix_llmio/claude_sdk/_stream.py" = ["S110"]
# S101: assert used for unreachable-branch documentation after an
# exhaustive loop (not input validation).
"src/robotsix_llmio/claude_sdk/_tool_agent.py" = ["S101"]
# S110 (try-except-pass): swallowing errors from best-effort subprocess
# teardown; the query result is already decided at that point.
"src/robotsix_llmio/claude_sdk/model.py" = ["S110"]
# S101: asserts are mypy type-narrowing hints on invariants, not checks.
# S311: random.uniform provides retry-backoff jitter — not cryptographic.
"src/robotsix_llmio/core/retry.py" = ["S101", "S311"]

# S101: pytest tests assert by design. S106: hard-coded dummy credentials
# are test fixtures, not secrets.
"tests/**/*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "robotsix_llmio.openrouter._deepseek_model"
disable_error_code = ["typeddict-item", "override", "misc", "literal-required"]

[[tool.mypy.overrides]]
module = "robotsix_llmio.openrouter._deepseek_provider"
disable_error_code = ["typeddict-item", "override", "misc", "literal-required"]

[[tool.mypy.overrides]]
module = [
    "opentelemetry.sdk.*",
    "opentelemetry.exporter.otlp.proto.http.trace_exporter",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/robotsix_llmio"]

[tool.coverage.report]
# One fleet-wide floor (robotsix-standards): 80, raised only fleet-wide.
# This local value keeps `pytest --cov` honest; the CI gate is the shared
# python-ci.yml workflow.
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests are opt-in: deselected by default so a plain `pytest` (and CI)
# never hits the network. Run them explicitly with `pytest -m live` (which
# overrides this) — they still self-skip without OPENROUTER_API_KEY.
addopts = ["-m", "not live", "--strict-markers", "--strict-config"]
# Global test timeout: 30s catches hung tests quickly; method=thread is
# compatible with pytest-xdist (-n auto) and works on all platforms.
timeout = 30
timeout_method = "thread"
xfail_strict = true
filterwarnings = [
    "error",
    # tests/core/test_core_http.py::test_finalizer_closes_client_on_gc
    # deliberately drops a client and forces GC, leaving asyncio to emit a
    # ResourceWarning ("unclosed event loop") from a non-deterministic GC
    # point. Quarantine just this runtime noise; keep `error` for everything
    # else.
    "ignore:unclosed event loop:ResourceWarning",
]
markers = [
    "live: tests that require a live API connection and OPENROUTER_API_KEY",
]
