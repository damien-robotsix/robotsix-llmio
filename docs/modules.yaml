# Canonical module taxonomy for robotsix-llmio — what modules exist and
# where their files live (schema: robotsix-modules).
#
# `package` enables the convention globs (src/<package>/<id>/**,
# tests/<id>/**, docs/<id>/**) for entries that omit `paths`; a module
# lists paths only when it owns out-of-convention files.

package: robotsix_llmio

modules:
  - id: core
    description: >-
      Provider-agnostic base layer: the LLMProvider ABC, tier levels,
      bounded retry/backoff, cost-on-span recording, Langfuse tracing,
      the timeout HTTP client, and the generic pydantic-ai Agent
      assembler. Also owns the package root (exceptions, logging) and
      repo-level docs/changelog plumbing.
    paths:
      - src/robotsix_llmio/__init__.py
      - src/robotsix_llmio/exceptions.py
      - src/robotsix_llmio/logging.py
      - src/robotsix_llmio/changelog.py
      - src/robotsix_llmio/py.typed
      - src/robotsix_llmio/core/**
      - tests/.env.example
      - tests/__init__.py
      - tests/conftest.py
      - tests/core/**
      - docs/core/**
      - docs/reference/core.md
      - docs/reference/logging.md
      - docs/reference/exceptions.md
      - docs/index.md
      - docs/changelog.md
      - changelog.d/*.md

  - id: openrouter
    description: >-
      OpenRouter transport layer — base model-family-agnostic provider
      with a derived DeepSeek layer that pins to DeepSeek models and
      configures per-tier reasoning policy.
    paths:
      - src/robotsix_llmio/openrouter/**
      - tests/openrouter/**
      - docs/openrouter/**
      - docs/reference/openrouter.md

  - id: claude-sdk
    description: >-
      Claude Agent SDK transport — a sibling of the OpenRouter layer that
      drives the local `claude` CLI (subscription auth, no API key) and
      supports text / prompted-JSON output only. Directory names use
      snake_case (claude_sdk), hence the explicit paths.
    paths:
      - src/robotsix_llmio/claude_sdk/**
      - tests/claude_sdk/**
      - docs/claude_sdk/**
      - docs/reference/claude_sdk.md

  - id: clients
    description: >-
      Direct-HTTP REST clients for refdocs, knowledge-store, and
      self-review APIs. All three follow the same architectural pattern
      (async HTTP client + pydantic-ai tool adapter), replacing the
      agent-comm broker intermediary. The shared ``BaseHttpClient`` in
      ``_base.py`` eliminates duplicated ``_get()`` logic across the
      three sub-modules.
    paths:
      - src/robotsix_llmio/clients/**
      - tests/clients/**
      - docs/clients/**
      - docs/reference/refdocs.md
      - docs/reference/knowledge.md
      - docs/reference/self_review.md

  - id: config
    description: >-
      Consumer-facing configuration layer — TierConfig schema, loader,
      and the create_model factory.
    paths:
      - src/robotsix_llmio/config/**
      - tests/config/**
      - docs/config/**
      - docs/reference/config.md

  - id: dev-tooling
    description: >-
      Developer tooling and repo configuration: pyproject, lockfile,
      pre-commit hooks, CI workflows, mill periodic jobs, editor and
      static-analysis config. Not part of the shipped package.
    paths:
      - pyproject.toml
      - uv.lock
      - .pre-commit-config.yaml
      - .github/**
      - .robotsix-mill/**
      - .editorconfig
      - .gitignore
      - .secrets.baseline
      - .zizmor.yml
      - vulture_whitelist.py
      - mkdocs.yml
      - docs/modules.yaml

  - id: project-root
    description: >-
      Top-level housekeeping files: README, architecture and contributor
      docs, license, security policy, and the compiled changelog with its
      pending newsfragments.
    paths:
      - README.md
      - ARCHITECTURE.md
      - CONTRIBUTING.md
      - CHANGELOG.md
      - changelog.d/**
      - LICENSE
      - SECURITY.md
      - AGENT.md
