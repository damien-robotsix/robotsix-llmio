modules:
  - id: robotsix_llmio-core
    paths:
      - src/robotsix_llmio/__init__.py
      - src/robotsix_llmio/exceptions.py
      - src/robotsix_llmio/logging.py
      - src/robotsix_llmio/core/**
      - src/robotsix_llmio/py.typed
      - tests/__init__.py
      - tests/core/conftest.py
      - tests/core/test_core_agent.py
      - tests/core/test_core_retry.py
      - tests/core/test_core_run.py
      - tests/core/test_constants.py
      - tests/core/test_text_utils.py
      - tests/core/test_core_provider.py
      - tests/core/test_factory.py
      - tests/core/test_core_http.py
      - tests/core/test_core_cost.py
      - tests/core/test_core_cost_log.py
      - tests/core/test_langfuse_client.py
      - tests/core/test_langfuse_cost.py
      - tests/core/test_core_provider_cost.py
      - tests/core/test_otel.py
      - tests/core/test_tracing.py
      - tests/core/test_tracing_live.py
      - tests/core/test_logging.py
      - tests/conftest.py
      - docs/core/**
      - docs/reference/core.md
      - docs/reference/logging.md
      - docs/modules.yaml
      - docs/index.md
      - docs/changelog.md
  - id: robotsix_llmio-openrouter
    description: >
      OpenRouter transport layer — base model-family-agnostic provider.
    paths:
      - src/robotsix_llmio/openrouter/**
      - tests/openrouter/test_openrouter.py
      - tests/openrouter/test_openrouter_provider.py
      - tests/openrouter/test_openrouter_provider_cost.py
      - docs/openrouter/**
      - docs/reference/openrouter.md
  - id: robotsix_llmio-openrouter-deepseek
    description: >
      Derived DeepSeek layer that pins the generic OpenRouter transport
      to DeepSeek models and configures per-tier reasoning policy.
    paths:
      - src/robotsix_llmio/openrouter_deepseek/**
      - tests/openrouter_deepseek/test_openrouter_deepseek.py
      - tests/openrouter_deepseek/test_openrouter_deepseek_live.py
      - docs/openrouter_deepseek/**
      - docs/reference/openrouter_deepseek.md
  - id: robotsix_llmio-claude-sdk
    paths:
      - src/robotsix_llmio/claude_sdk/**
      - tests/claude_sdk/test_claude_sdk.py
      - tests/claude_sdk/test_confine_hook.py
      - tests/claude_sdk/test_stream.py
      - docs/claude_sdk/**
      - docs/reference/claude_sdk.md
  - id: robotsix_llmio-weekly-pace
    description: >
      Weekly Claude usage pace governor — compares weighted Claude
      consumption against the elapsed week fraction to spread usage
      across the week.
    paths:
      - src/robotsix_llmio/weekly_pace/**
      - src/robotsix_llmio/config/weekly_pace.py
      - tests/weekly_pace/test_weekly_pace.py
      - docs/weekly_pace/**
  - id: robotsix_llmio-tools
    description: >
      Built-in example tools (get_time, echo, calculator, roll_dice) for
      out-of-the-box agent functionality.
    paths:
      - src/robotsix_llmio/tools/**
      - tests/tools/test_builtins.py
