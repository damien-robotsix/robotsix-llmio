# Per-repo periodic workflow: presence enables it for this repo.
# Name-only → inherits the built-in langfuse_cleanup params.
name: langfuse_cleanup

# Scope: robotsix-mill orchestration traces only.
# This periodic workflow cleans up Langfuse trace data created by robotsix-mill
# when orchestrating workflows (audit, bc_check, completeness_check, etc.)
# against this repo. Retention periods are configured centrally in the
# robotsix-mill repo (repo.yaml), not here.
#
# Test-run trace cleanup is out of scope. Traces generated by this repo's own
# integration tests (e.g. tests/core/test_tracing_live.py) belong in per-test-run
# teardown — a conftest.py fixture, not a mill periodic workflow.
